name: Agent Build

# 自主接力制作流水线（公仓，GLM/ZAI 驱动）。
# cron 每 15min 拉起；loop.sh 首步做「跳过检查（在跑就退）+ GLM 探活（不通就退）」，
# 然后 while 循环：主理人派单（队列空则按 roadmap 建 issue）→ 认领最老 issue → pi 单代理产出
# → 自验证 → 合 main。无多代理会审。GLM 失效 / 时间到则退出，下次拉起接力。
# 公仓 Actions 分钟数不限，成本只有 GLM API 调用；队列空即秒退，不空转烧钱。

on:
  schedule:
    - cron: '*/15 * * * *'   # 每15min 拉起；在跑则 loop.sh 首步跳过
  workflow_dispatch:
    inputs:
      issue_number:
        description: '起始 issue 号（不填则主理人按路线图派单 / 认领最老 agent-build）'
        required: false

permissions:
  contents: write
  issues: write
  actions: read   # gh run list 做跳过检查

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 留余量（hosted 单 job 上限 6h=360min）
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ZAI_CODING_CN_API_KEY: ${{ secrets.ZAI_CODING_CN_API_KEY }}
      PI_PROVIDER: zai-coding-cn
      PI_MODEL: ${{ vars.PI_MODEL || 'glm-5.3' }}
      PI_CALL_TIMEOUT: '2700'   # 单次 pi 调用上限 45min（防挂死）
      PI_CODING_AGENT_DIR: /home/runner/.pi-cfg   # 显式指定配置目录，确保读到注入的 models.json
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}   # MiniMax Token Plan 订阅 Key（多模态资产生成；未配则 mmx 调用失败、自动降级纯文档）
      MINIMAX_REGION: cn
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 安装 pi（>=0.84.1 支持 print 模式 -a）
        run: |
          npm install -g @earendil-works/pi-coding-agent@latest
          pi --version
      - name: 注入 zai-coding-cn provider（CI 全新 pi 无 catalog，写 $PI_CODING_AGENT_DIR/models.json）
        run: |
          mkdir -p "$PI_CODING_AGENT_DIR"
          cp .github/pi-models.json "$PI_CODING_AGENT_DIR/models.json"
          echo "=== 验证 pi 是否识别 zai-coding-cn ==="
          pi --list-models 2>&1 | grep -i zai | head -5 || echo "（未识别 zai-coding-cn！）"
      - name: 安装 mmx（MiniMax 多模态 CLI；失败不阻断，美术/音频项降级纯文档）
        continue-on-error: true
        run: npm install -g mmx-cli
      - name: mmx 鉴权 + 验证额度（Token Plan 订阅 Key；持久化到 ~/.mmx 供专家 pi 会话复用）
        continue-on-error: true
        run: |
          echo "=== mmx auth login --api-key（非交互持久化）==="
          mmx auth login --api-key "$MINIMAX_API_KEY" 2>&1 | head -8
          echo "=== mmx quota（验证鉴权 + 额度）==="
          mmx quota 2>&1 | head -25
      - name: 接力循环
        run: bash .github/agent-build-loop.sh "${{ inputs.issue_number || '' }}" || true
